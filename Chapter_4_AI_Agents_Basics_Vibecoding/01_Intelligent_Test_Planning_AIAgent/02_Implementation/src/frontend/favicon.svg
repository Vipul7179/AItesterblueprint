  <path d="M32 9L52 20.5V43.5L32 55L12 43.5V20.5L32 9Z" stroke="url(#favGrad1)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Prismatic Facet -->
  <path d="M32 19L44 26V38L32 45L20 38V26L32 19Z" fill="url(#favGrad2)" fill-opacity="0.3" stroke="url(#favGrad2)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Radiating Synaptic Connectors -->
  <line x1="32" y1="9" x2="32" y2="19" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="20.5" x2="44" y2="26" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="43.5" x2="44" y2="38" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="55" x2="32" y2="45" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="43.5" x2="20" y2="38" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="20.5" x2="20" y2="26" stroke="url(#favGrad1)" stroke-width="2.5" stroke-linecap="round"/>

