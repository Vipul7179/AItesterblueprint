  <circle cx="32" cy="9" r="2.5" fill="#38bdf8"/>
  <circle cx="52" cy="20.5" r="2.5" fill="#818cf8"/>
  <circle cx="52" cy="43.5" r="2.5" fill="#c084fc"/>
  <circle cx="32" cy="55" r="2.5" fill="#ec4899"/>
  <circle cx="12" cy="43.5" r="2.5" fill="#8b5cf6"/>
  <circle cx="12" cy="20.5" r="2.5" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
